version: "3.9"

# Deliverable (4.5 Deployment): "Docker deployment (for backend + DB)".
# The assessment says "Use SQLite for now", so the default setup here runs
# the backend in Docker with the SQLite database file persisted on a
# volume (functionally: backend + DB, containerized). A Postgres service
# is included but commented out for when you outgrow SQLite - swapping is
# a two-line change (settings.DATABASES + this file), no application code
# changes needed.

services:
  backend:
    build: .
    container_name: ledgerco_backend
    env_file: .env
    environment:
      - DJANGO_DB_DIR=/app/data
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ledgerco_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # --- Optional: swap SQLite for Postgres later -----------------------------
  # db:
  #   image: postgres:16-alpine
  #   container_name: ledgerco_postgres
  #   environment:
  #     POSTGRES_DB: ledgerco
  #     POSTGRES_USER: ledgerco
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  sqlite_data:
  media_data:
  logs_data:
  redis_data:
  # postgres_data:
