{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with bKash — Ledger &amp; Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-row">
            <a href="{% url 'index' %}" class="brand"><span class="brand-mark">§</span><span class="brand-name">Ledger<em>&amp;Co.</em></span></a>
            <nav class="main-nav">
                <div class="nav-dropdown">
                    <button class="nav-link nav-dropdown-toggle" type="button">Categories</button>
                    <div class="nav-dropdown-menu" id="nav-categories-menu"><span class="muted">Loading…</span></div>
                </div>
                <form class="nav-search" action="{% url 'index' %}" method="get"><input type="text" name="q" placeholder="Search the catalog…"></form>
            </nav>
            <div class="header-actions">
                <a href="{% url 'cart' %}" class="cart-link">Cart <span class="cart-badge" id="cart-badge">0</span></a>
                <div id="auth-area"></div>
            </div>
        </div>
    </header>
    <main>
        <div class="form-card" style="max-width: 480px;" id="bkash-container">
            <div class="state-box">Loading…</div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="wrap footer-row">
            <div><span class="brand-mark">§</span> Ledger&amp;Co. — decoupled frontend, hosted on Vercel.</div>
            <div class="muted api-indicator">API: <span id="api-base-label"></span></div>
        </div>
    </footer>
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/cart.js' %}"></script>
    <script src="{% static 'js/ui.js' %}"></script>
    <script src="{% static 'js/nav.js' %}"></script>
    <script src="{% static 'js/payment-bkash.js' %}"></script>
</body>
</html>
