<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Ledger &amp; Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-row">
            <a href="index.html" class="brand"><span class="brand-mark">§</span><span class="brand-name">Ledger<em>&amp;Co.</em></span></a>
            <nav class="main-nav">
                <div class="nav-dropdown">
                    <button class="nav-link nav-dropdown-toggle" type="button">Categories</button>
                    <div class="nav-dropdown-menu" id="nav-categories-menu"><span class="muted">Loading…</span></div>
                </div>
                <form class="nav-search" action="index.html" method="get"><input type="text" name="q" placeholder="Search the catalog…"></form>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-link">Cart <span class="cart-badge" id="cart-badge">0</span></a>
                <div id="auth-area"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="form-card">
            <h2 class="center">Create an account</h2>
            <form id="register-form">
                <div class="row">
                    <div class="field" style="flex:1;">
                        <label for="first_name">First name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="field" style="flex:1;">
                        <label for="last_name">Last name</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                </div>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="field">
                    <label for="phone_number">Phone number (optional)</label>
                    <input type="text" id="phone_number" name="phone_number">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-jade btn-block">Create account</button>
            </form>
            <div class="form-foot">Already have an account? <a href="login.html" style="font-weight:600;">Log in</a></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap footer-row">
            <div><span class="brand-mark">§</span> Ledger&amp;Co. — decoupled frontend, hosted on Vercel.</div>
            <div class="muted api-indicator">API: <span id="api-base-label"></span></div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
